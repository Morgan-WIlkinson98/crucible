name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: mac }
          - { os: windows-latest, name: win }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts=false

      - name: Generate icons
        run: node scripts/make-icons.js

      - name: Build crucible-agent (macOS)
        if: matrix.name == 'mac'
        run: swiftc -O -o build/crucible-agent swift/crucible-agent.swift

      - name: Disable Spotlight on volumes (prevents hdiutil detach EBUSY)
        if: matrix.name == 'mac'
        run: |
          sudo mdutil -a -i off || true
          hdiutil detach -force /Volumes/Crucible 2>/dev/null || true

      - name: Build installer (macOS)
        if: matrix.name == 'mac'
        run: |
          npx electron-builder --mac dmg --x64 --arm64 --publish never || \
          { echo "dmg failed — falling back to zip"; npx electron-builder --mac zip --x64 --arm64 --publish never; }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build installer (Windows)
        if: matrix.name == 'win'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crucible-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4   # gh release needs repo context
      - uses: actions/download-artifact@v4
        with:
          pattern: crucible-*
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # create release if absent, then upload each artifact (spaces in
          # "Crucible Setup x.y.z.exe" need -print0/xargs -0)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.zip" \) -print0 | \
            xargs -0 -I{} gh release upload "$GITHUB_REF_NAME" "{}" --clobber
