appId: com.crucible.app
productName: Crucible
directories:
  buildResources: build
  output: dist
files:
  - src/**
  - package.json
  - node_modules/**
  - build/**
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
  - node_modules/sharp/**
  - node_modules/@napi-rs/canvas/**
  - node_modules/@img/**
mac:
  category: public.app-category.utilities
  extraResources:
    - from: build/crucible-agent
      to: bin/crucible-agent
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.plist
  entitlementsInherit: build/entitlements.plist
  extendInfo:
    NSAppleEventsUsageDescription: "Crucible uses Apple apps (Pages, Numbers, Keynote) to convert Apple-format files."
dmg:
  title: Crucible
  # No custom icon layout — Finder scripting fails on headless CI runners
  # and leaves the volume mounted (hdiutil detach errors). Default layout works.
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Crucible
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
