<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 96px; height: 96px; background: transparent; overflow: hidden;
               font-family: -apple-system, 'Segoe UI', sans-serif; user-select: none; }
  #orb {
    position: absolute; inset: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a3a42 0%, #1a1a1e 70%);
    border: 1px solid rgba(255, 106, 42, .35);
    box-shadow: 0 4px 18px rgba(0,0,0,.5), inset 0 0 18px rgba(255,106,42,.12);
    display: flex; align-items: center; justify-content: center;
    cursor: grab; transition: box-shadow .15s, transform .15s;
  }
  #orb.over {
    box-shadow: 0 0 0 3px rgba(255,106,42,.8), 0 4px 24px rgba(255,106,42,.35),
                inset 0 0 24px rgba(255,106,42,.3);
    transform: scale(1.06);
  }
  #core {
    width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffb37a, #ff6a2a 55%, #c23f0e);
    box-shadow: 0 0 14px rgba(255,106,42,.55);
    transition: transform .15s;
  }
  #orb.over #core { transform: scale(1.25); }
  #orb.busy #core { animation: pulse .9s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.75); opacity: .8 } }
  svg#ring { position: absolute; inset: 2px; transform: rotate(-90deg); }
  #ring circle { fill: none; stroke-width: 4; }
  #ring .bg { stroke: rgba(255,255,255,.08); }
  #ring .fg { stroke: #ff6a2a; stroke-linecap: round;
              stroke-dasharray: 264; stroke-dashoffset: 264; transition: stroke-dashoffset .2s; }
  #label {
    position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: #ff9c6b; white-space: nowrap; opacity: 0; transition: opacity .3s;
  }
  #label.show { opacity: 1; }
</style>
</head>
<body>
  <svg id="ring" viewBox="0 0 96 96"><circle class="bg" cx="48" cy="48" r="42"/><circle class="fg" id="fg" cx="48" cy="48" r="42"/></svg>
  <div id="orb"><div id="core"></div></div>
  <div id="label"></div>
<script src="orb.js"></script>
</body>
</html>
